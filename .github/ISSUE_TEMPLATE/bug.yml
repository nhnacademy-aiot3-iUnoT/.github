name: "🐞 Bug Report"
description: "버그를 제보하거나 수정 작업을 등록합니다."
title: "[Bug] "
labels:
  - bug

body:
  - type: textarea
    id: summary
    attributes:
      label: 🐛 버그 내용
      description: 무엇이 문제인지 간단히 작성해주세요.
      placeholder: |
        로그인 후 메인 화면으로 이동하지 않습니다.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 🔄 재현 방법
      placeholder: |
        1. 로그인
        2. 버튼 클릭
        3. ...
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: 🛠 작업 내용
      value: |
        - [ ] 원인 분석
        - [ ] 수정
        - [ ] 테스트
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 🚨 우선순위
      options:
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: 📎 참고 자료
      placeholder: |
        Error Log
        Screenshot
        Related Issue / PR
